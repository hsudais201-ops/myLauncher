name: Website server status tests

on:
  push:
    branches:
      - main
    paths:
      - 'website/assets/server-state.js'
      - 'website/functions/api/server-status.js'
      - 'website/tests/**'
      - '.github/workflows/website-status-tests.yml'
  pull_request:
    paths:
      - 'website/assets/server-state.js'
      - 'website/functions/api/server-status.js'
      - 'website/tests/**'
      - '.github/workflows/website-status-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-status-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test server status endpoint
        run: node --test website/tests/server-status.test.mjs
