name: Launcher core tests

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-core-tests.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile with warnings as errors and run regression tests
        run: ./launcher/test.sh
