name: Build myLauncher APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylauncher-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out myLauncher customizations
        uses: actions/checkout@v4

      - name: Validate customizer and regression suite
        run: |
          python3 -m py_compile .github/scripts/customize_amethyst.py .github/scripts/test_customizer.py
          python3 -m py_compile .github/scripts/customize_ui.py .github/scripts/test_ui_customizer.py
          sh -n .github/scripts/prepare_emulator_kvm.sh
          sh -n .github/scripts/emulator_smoke_test.sh
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Accept licenses explicitly in the next step to avoid interactive setup failures.
          accept-android-sdk-licenses: false
          # The old "tools" package no longer exists; the build installs exact SDK/NDK packages below.
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install required Android SDK and NDK
        run: sdkmanager --install 'platforms;android-37.0' 'ndk;27.3.13750724' --channel=3

      - name: Fetch pinned Amethyst engine and submodules
        run: |
          EXPECTED_UPSTREAM_COMMIT=330c6eae3164df64bdc4828e946a9e62cc5169e4
          git init upstream
          git -C upstream remote add origin https://github.com/AngelAuraMC/Amethyst-Android.git
          git -C upstream fetch --depth 1 origin "$EXPECTED_UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

          # The pinned upstream .gitmodules includes an SSH-style GitHub URL.
          # Hosted runners have no personal SSH key, so use public HTTPS clones.
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git -C upstream submodule sync --recursive
          git -C upstream submodule update --init --recursive
          git -C upstream submodule status --recursive | tee /tmp/mylauncher-submodules.txt
          if grep -Eq '^[+-U]' /tmp/mylauncher-submodules.txt; then
            echo "A submodule is missing or not checked out at the commit pinned by upstream." >&2
            exit 1
          fi

          ACTUAL_UPSTREAM_COMMIT=$(git -C upstream rev-parse HEAD)
          echo "Expected upstream: $EXPECTED_UPSTREAM_COMMIT"
          echo "Actual upstream:   $ACTUAL_UPSTREAM_COMMIT"
          test "$ACTUAL_UPSTREAM_COMMIT" = "$EXPECTED_UPSTREAM_COMMIT"

      - name: Apply and inspect myLauncher customization
        run: |
          python3 .github/scripts/customize_amethyst.py upstream
          python3 .github/scripts/customize_ui.py upstream
          git -C upstream diff --check

      - name: Record upstream revision
        run: |
          echo "Upstream: https://github.com/AngelAuraMC/Amethyst-Android" > upstream/MYLAUNCHER_BUILD_INFO.txt
          echo "Source line: v3_openjdk (commit pinned below)" >> upstream/MYLAUNCHER_BUILD_INFO.txt
          echo "Pinned commit: 330c6eae3164df64bdc4828e946a9e62cc5169e4" >> upstream/MYLAUNCHER_BUILD_INFO.txt
          echo "Built commit: $(git -C upstream rev-parse HEAD)" >> upstream/MYLAUNCHER_BUILD_INFO.txt
          echo "Custom app ID: com.mf.mylauncher (debug: com.mf.mylauncher.debug)" >> upstream/MYLAUNCHER_BUILD_INFO.txt

      - name: Build GLFW support and debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon :jre_lwjgl3glfw:build :app_pojavlauncher:assembleDebug --stacktrace

      - name: Confirm APK and inspect package metadata
        run: |
          APK=$(find upstream/app_pojavlauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print -quit)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          grep -q 'applicationId "com.mf.mylauncher"' upstream/app_pojavlauncher/build.gradle
          grep -q 'app_name.*myLauncher' upstream/app_pojavlauncher/src/main/res/values/strings.xml
          AAPT=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print -quit)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/mylauncher-badging.txt
          grep -q "package: name='com.mf.mylauncher.debug'" /tmp/mylauncher-badging.txt
          grep -q "application-label:'myLauncher (Debug)'" /tmp/mylauncher-badging.txt
          MIN_SDK=$(sed -n "s/^sdkVersion:'\\([0-9][0-9]*\\)'.*/\\1/p" /tmp/mylauncher-badging.txt)
          test -n "$MIN_SDK"
          test "$MIN_SDK" -le 28
          echo "Verified APK metadata (min SDK: $MIN_SDK):"
          grep -E "^(package: name=|application-label:)" /tmp/mylauncher-badging.txt
          APK_SHA256_PATH="${APK}.sha256"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          echo "APK_SHA256_PATH=$APK_SHA256_PATH" >> "$GITHUB_ENV"
          echo "APK SHA-256: $(cut -d ' ' -f1 "$APK_SHA256_PATH")" >> upstream/MYLAUNCHER_BUILD_INFO.txt

      - name: Stop Gradle daemons before emulator startup
        working-directory: upstream
        run: ./gradlew --stop || true
      - name: Install and launch APK in a headless Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 28 is the documented minimum device target and boots a smaller image than API 35.
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 1536M
          heap-size: 512M
          disable-animations: true
          # Grant the hosted runner access to KVM so the x86_64 emulator does not fall back to slow software emulation.
          disable-linux-hw-accel: false
          pre-emulator-launch-script: sh .github/scripts/prepare_emulator_kvm.sh
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: sh .github/scripts/emulator_smoke_test.sh "$APK_PATH"

      - name: Upload debug APK
        if: ${{ always() && env.APK_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: myLauncher-debug-apk
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_SHA256_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload upstream build notes
        if: ${{ always() && hashFiles('upstream/MYLAUNCHER_BUILD_INFO.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: myLauncher-build-info
          path: upstream/MYLAUNCHER_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: myLauncher-emulator-diagnostics
          path: |
            upstream/mylauncher-emulator-logcat.txt
            upstream/mylauncher-activities.txt
          if-no-files-found: ignore
          retention-days: 7