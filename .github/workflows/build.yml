name: Build myLauncher APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylauncher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out myLauncher customizations
        uses: actions/checkout@v4

      - name: Validate customizer and regression suite
        run: |
          python3 -m py_compile .github/scripts/customize_amethyst.py .github/scripts/test_customizer.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install required Android SDK and NDK
        run: sdkmanager --install 'platforms;android-37' 'ndk;27.3.13750724'

      - name: Fetch pinned Amethyst engine and submodules
        run: |
          EXPECTED_UPSTREAM_COMMIT=330c6eae3164df64bdc4828e946a9e62cc5169e4
          git init upstream
          git -C upstream remote add origin https://github.com/AngelAuraMC/Amethyst-Android.git
          git -C upstream fetch --depth 1 origin "$EXPECTED_UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD
          git -C upstream submodule update --init --recursive
          ACTUAL_UPSTREAM_COMMIT=$(git -C upstream rev-parse HEAD)
          echo "Expected upstream: $EXPECTED_UPSTREAM_COMMIT"
          echo "Actual upstream:   $ACTUAL_UPSTREAM_COMMIT"
          test "$ACTUAL_UPSTREAM_COMMIT" = "$EXPECTED_UPSTREAM_COMMIT"

      - name: Apply and inspect myLauncher customization
        run: python3 .github/scripts/customize_amethyst.py upstream

      - name: Record upstream revision
        run: |
          echo "Upstream: https://github.com/AngelAuraMC/Amethyst-Android" > upstream/MYLAUNCHER_BUILD_INFO.txt
          echo "Branch: v3_openjdk" >> upstream/MYLAUNCHER_BUILD_INFO.txt
          echo "Pinned commit: 330c6eae3164df64bdc4828e946a9e62cc5169e4" >> upstream/MYLAUNCHER_BUILD_INFO.txt
          echo "Built commit: $(git -C upstream rev-parse HEAD)" >> upstream/MYLAUNCHER_BUILD_INFO.txt
          echo "Custom app ID: com.mf.mylauncher (debug: com.mf.mylauncher.debug)" >> upstream/MYLAUNCHER_BUILD_INFO.txt

      - name: Build GLFW support and debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon :jre_lwjgl3glfw:build :app_pojavlauncher:assembleDebug --stacktrace

      - name: Confirm APK and inspect package metadata
        run: |
          APK=$(find upstream/app_pojavlauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          grep -q 'applicationId "com.mf.mylauncher"' upstream/app_pojavlauncher/build.gradle
          grep -q 'app_name.*myLauncher' upstream/app_pojavlauncher/src/main/res/values/strings.xml
          AAPT=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print -quit)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/mylauncher-badging.txt
          grep -q "package: name='com.mf.mylauncher.debug'" /tmp/mylauncher-badging.txt
          grep -q "application-label:'myLauncher (Debug)'" /tmp/mylauncher-badging.txt
          MIN_SDK=$(sed -n "s/^sdkVersion:'\\([0-9][0-9]*\\)'.*/\\1/p" /tmp/mylauncher-badging.txt)
          test -n "$MIN_SDK"
          test "$MIN_SDK" -le 28
          echo "Verified APK metadata (min SDK: $MIN_SDK):"
          grep -E "^(package: name=|application-label:)" /tmp/mylauncher-badging.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myLauncher-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload upstream build notes
        uses: actions/upload-artifact@v4
        with:
          name: myLauncher-build-info
          path: upstream/MYLAUNCHER_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14