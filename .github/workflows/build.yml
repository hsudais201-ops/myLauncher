name: Build VoidCraft Launcher APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
      - 'README.md'
      - 'FEATURE_ROADMAP.md'
      - 'MOJO_UPSTREAM_NOTICES.md'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
      - 'README.md'
      - 'FEATURE_ROADMAP.md'
      - 'MOJO_UPSTREAM_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidcraft-mojo-build
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build Mojo-based VoidCraft APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out VoidCraft build customizations
        uses: actions/checkout@v4

      - name: Validate VoidCraft source customizer and regression tests
        run: |
          python3 -m py_compile .github/scripts/customize_mojo.py .github/scripts/test_mojo_customizer.py
          sh -n .github/scripts/prepare_emulator_kvm.sh
          bash -n .github/scripts/mojo_emulator_smoke_test.sh
          python3 -m unittest discover -s .github/scripts -p 'test_mojo_customizer.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install pinned Android SDK and NDK
        run: sdkmanager --install 'platforms;android-36' 'ndk;29.0.14206865' --channel=3

      - name: Fetch pinned MojoLauncher source and submodules
        run: |
          EXPECTED_UPSTREAM_COMMIT=8ffba8f4ea0b9466854aa9f7a375c77b4fb96bdd
          git init upstream
          git -C upstream remote add origin https://github.com/MojoLauncher/MojoLauncher.git
          git -C upstream fetch --depth 1 origin "$EXPECTED_UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

          # Rewrite SSH-form GitHub submodule URLs to public HTTPS for hosted runners.
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git -C upstream submodule sync --recursive
          git -C upstream submodule update --init --recursive
          git -C upstream submodule status --recursive | tee /tmp/voidcraft-mojo-submodules.txt
          if grep -Eq '^[+-U]' /tmp/voidcraft-mojo-submodules.txt; then
            echo "A MojoLauncher submodule is missing or not at its pinned commit." >&2
            exit 1
          fi
          ACTUAL_UPSTREAM_COMMIT=$(git -C upstream rev-parse HEAD)
          echo "Expected MojoLauncher: $EXPECTED_UPSTREAM_COMMIT"
          echo "Actual MojoLauncher:   $ACTUAL_UPSTREAM_COMMIT"
          test "$ACTUAL_UPSTREAM_COMMIT" = "$EXPECTED_UPSTREAM_COMMIT"

      - name: Apply VoidCraft package identity, app label, and night-violet palette
        run: |
          python3 .github/scripts/customize_mojo.py upstream
          git -C upstream diff --check

      - name: Build full debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon :app_mojo:assembleFullDebug --stacktrace

      - name: Verify APK package, signature, and minimum SDK
        run: |
          APK=$(find upstream/app_mojo/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/voidcraft-mojo-badging.txt
          grep -q "package: name='com.mf.mylauncher.debug'" /tmp/voidcraft-mojo-badging.txt
          grep -q "application-label:'VoidCraft Launcher'" /tmp/voidcraft-mojo-badging.txt
          MIN_SDK=$(sed -n "s/^sdkVersion:'\([0-9][0-9]*\)'.*/\1/p" /tmp/voidcraft-mojo-badging.txt)
          test -n "$MIN_SDK"
          test "$MIN_SDK" -le 28
          echo "Verified APK metadata (min SDK: $MIN_SDK)"
          grep -E "^(package: name=|application-label:)" /tmp/voidcraft-mojo-badging.txt
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")

      - name: Stop Gradle daemons before emulator startup
        working-directory: upstream
        run: ./gradlew --stop || true

      - name: Install and launch the Mojo-based APK in Android 9 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 1536M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: sh .github/scripts/prepare_emulator_kvm.sh
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: bash .github/scripts/mojo_emulator_smoke_test.sh "$APK_PATH"

      - name: Upload VoidCraft debug APK and license/build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voidcraft-mojo-debug-apk
          path: |
            upstream/app_mojo/build/outputs/apk/full/debug/*.apk
            upstream/app_mojo/build/outputs/apk/full/debug/*.sha256
            upstream/VOIDCRAFT_LAUNCHER_BUILD_INFO.txt
            upstream/VOIDCRAFT_MOJO_LICENSE.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voidcraft-mojo-emulator-diagnostics
          path: |
            upstream/voidcraft-mojo-emulator-logcat.txt
            upstream/voidcraft-mojo-activities.txt
            upstream/voidcraft-mojo-emulator-screenshot.png
          if-no-files-found: ignore
          retention-days: 7
