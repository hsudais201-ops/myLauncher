name: Build independent VoidCraft shell

on:
  push:
    branches: [rewrite/voidcraft-original-codebase]
    paths:
      - 'voidcraft-app/**'
      - '.github/workflows/voidcraft-shell.yml'
  pull_request:
    paths:
      - 'voidcraft-app/**'
      - '.github/workflows/voidcraft-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidcraft-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-shell:
    name: Compile independent Android shell
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile independent shell
        working-directory: voidcraft-app
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: voidcraft-independent-shell-debug
          path: voidcraft-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
