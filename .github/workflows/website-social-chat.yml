name: Verify website social chat
on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-social-chat.yml"
  push:
    branches:
      - feature/website-social-chat
    paths:
      - "website/**"
      - ".github/workflows/website-social-chat.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Check website chat integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check "website/functions/api/chat/[[path]].js"
          node --check website/assets/chat.js
      - name: Run website chat integration checks
        run: node --test website/tests/social-chat.test.mjs
