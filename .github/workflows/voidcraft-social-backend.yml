name: VoidCraft Social Backend Check

on:
  pull_request:
    paths:
      - "voidcraft-social-backend/**"
      - ".github/workflows/voidcraft-social-backend.yml"
  push:
    branches:
      - feature/secure-local-feature-registry
    paths:
      - "voidcraft-social-backend/**"
      - ".github/workflows/voidcraft-social-backend.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Syntax and backend smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voidcraft-social-backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Worker syntax and tests
        run: npm run verify
