name: Diagnose GitHub Actions runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylauncher-runner-diagnostic
  cancel-in-progress: true

jobs:
  runner-smoke-test:
    name: Check runner provisioning
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Confirm a hosted runner was assigned
        run: |
          echo "RUNNER_DIAGNOSTIC=started"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          echo "UTC time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uname -a
      - name: Verify a basic shell step
        run: |
          set -eu
          test -n "$GITHUB_REPOSITORY"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"
          echo "RUNNER_DIAGNOSTIC=passed"
