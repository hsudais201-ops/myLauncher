name: Android build and tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package is obsolete and fails on current SDK repositories.
          packages: "platform-tools"

      - name: Install Android SDK platform, build tools, NDK, and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Provision Gradle distribution with retry
        shell: bash
        run: |
          # The wrapper distribution is hosted behind a redirect that can
          # intermittently return HTTP 504. Retry only the provisioning step;
          # real build/test failures remain immediately visible below.
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle distribution provisioning failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flame-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
