name: Android build and tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK, build tools, and NDK
        run: |
          sdkmanager "platforms;android-36" "platforms;android-36-ext20" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Initialize pinned Amethyst source and nested dependencies
        run: |
          # Upstream's androidnsbypass submodule uses an SSH URL; CI uses public HTTPS.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init engine/amethyst
          git -C engine/amethyst submodule sync --recursive
          git -C engine/amethyst submodule update --init --recursive
          python3 scripts/prepare_amethyst_library.py

      - name: Run standalone unit tests and assemble debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Build and test Flame with the Amethyst runtime
        run: ./gradlew --no-daemon -PwithAmethyst=true testDebugUnitTest assembleDebug

      - name: Upload integrated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flame-launcher-amethyst-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
