name: Android build

on:
  push:
    paths:
      - "mobile-launcher/android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mobile-launcher/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run planner unit tests
        run: gradle -p mobile-launcher/android :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle -p mobile-launcher/android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mylauncher-debug-apk
          path: mobile-launcher/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
