name: Android launcher shell build

on:
  push:
    branches: [main]
    paths:
      - 'launcher/android-app/**'
      - 'launcher/src/main/java/**'
      - '.github/workflows/android-shell-build.yml'
  pull_request:
    paths:
      - 'launcher/android-app/**'
      - 'launcher/src/main/java/**'
      - '.github/workflows/android-shell-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        working-directory: launcher/android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK package metadata
        run: |
          APK='launcher/android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.mf.mylauncher'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myLauncher-core-shell-debug-apk
          path: launcher/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
