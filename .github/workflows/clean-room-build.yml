name: VoidCraft clean-room Android build

on:
  push:
    branches:
      - main
      - feature/voidcraft-clean-room-foundation
    paths:
      - 'voidcraft-android/**'
      - 'CLEAN_ROOM_POLICY.md'
      - 'COPYRIGHT_AND_LICENSE_AUDIT.md'
      - '.github/workflows/clean-room-build.yml'
  pull_request:
    paths:
      - 'voidcraft-android/**'
      - 'CLEAN_ROOM_POLICY.md'
      - 'COPYRIGHT_AND_LICENSE_AUDIT.md'
      - '.github/workflows/clean-room-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidcraft-clean-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Verify original source and build standalone APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run clean-room boundary tests
        run: python3 -m unittest discover -s voidcraft-android/tests -v

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Avoid the obsolete SDK package named "tools"; install exact packages below.
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build standalone debug APK
        run: gradle -p voidcraft-android --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK metadata, signature, and checksum
        run: |
          APK="voidcraft-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print -quit)
          AAPT=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print -quit)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" > /tmp/voidcraft-clean-room-badging.txt
          grep -q "package: name='com.voidcraft.launcher.debug'" /tmp/voidcraft-clean-room-badging.txt
          grep -q "application-label:'VoidCraft Launcher'" /tmp/voidcraft-clean-room-badging.txt
          MIN_SDK=$(sed -n "s/^sdkVersion:'\\([0-9][0-9]*\\)'.*/\\1/p" /tmp/voidcraft-clean-room-badging.txt)
          test "$MIN_SDK" -eq 28
          SHA_FILE="${APK}.sha256"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          {
            echo "Build path: clean-room project voidcraft-android/"
            echo "Source commit: $GITHUB_SHA"
            echo "Application ID: com.voidcraft.launcher.debug"
            echo "Minimum Android SDK: $MIN_SDK"
            echo "Copyright / dependency status: INCOMPLETE — independent foundation, not legal clearance"
            echo "Playability: not playable; no game downloader/runtime/renderer is integrated"
            echo "APK SHA-256: $(cut -d ' ' -f1 "$SHA_FILE")"
          } > voidcraft-android/CLEAN_ROOM_BUILD_INFO.txt
          echo "Verified standalone APK metadata and SHA-256."

      - name: Upload clean-room debug APK and build information
        uses: actions/upload-artifact@v4
        with:
          name: voidcraft-clean-room-debug-apk
          path: |
            voidcraft-android/app/build/outputs/apk/debug/app-debug.apk
            voidcraft-android/app/build/outputs/apk/debug/app-debug.apk.sha256
            voidcraft-android/CLEAN_ROOM_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
