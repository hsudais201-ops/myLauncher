[package]
name = "mflegend"
version = "0.1.0"
description = "Flame Launcher Minecraft Java Edition launcher"
authors = ["MFLegend"]
edition = "2021"

[lib]
name = "mflegend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["fs", "process", "macros", "rt-multi-thread"] }
dirs = "5"
sha1 = "0.10"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
