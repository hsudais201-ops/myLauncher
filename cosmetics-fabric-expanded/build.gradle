plugins {
    // Minecraft 1.21.8–1.21.11 still use the remapped/obfuscated game artifact.
    id 'net.fabricmc.fabric-loom-remap' version "1.14.9"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

// Rendering changed again in 1.21.9: FeatureRenderer uses ordered render
// commands and RenderLayers instead of direct VertexConsumer access.
def orderedRenderQueue = project.minecraft_version.tokenize('.').with {
    (it[0] as int) == 1 && (it[1] as int) == 21 &&
        (it.size() > 2 ? (it[2] as int) >= 9 : false)
}
// Reuse common model/test sources, with distinct renderer adapters by API era.
sourceSets {
    main {
        java {
            setSrcDirs([
                "../cosmetics-fabric/src/common/java",
                orderedRenderQueue ? "src/ordered/java" :
                    "../cosmetics-fabric/src/state/java"
            ])
        }
        resources {
            setSrcDirs(["../cosmetics-fabric/src/main/resources"])
        }
    }
    test {
        java {
            setSrcDirs(["../cosmetics-fabric/src/test/java"])
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "java_dependency", project.java_dependency
    inputs.property "loader_version", project.loader_version
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "java_dependency": project.java_dependency,
            "loader_version": project.loader_version
        )
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_bytecode_version.toInteger()
}

test {
    useJUnitPlatform()
}
