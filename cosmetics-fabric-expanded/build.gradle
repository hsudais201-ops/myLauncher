plugins {
    // Minecraft 1.21.8–1.21.11 still use the remapped/obfuscated game artifact.
    id 'net.fabricmc.fabric-loom-remap' version "1.14.9"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

// These releases use the render-state implementation from the main cosmetics
// project. Reuse the sources so compatibility patches remain in one place.
sourceSets {
    main {
        java {
            setSrcDirs([
                "../cosmetics-fabric/src/common/java",
                "../cosmetics-fabric/src/state/java"
            ])
        }
        resources {
            setSrcDirs(["../cosmetics-fabric/src/main/resources"])
        }
    }
    test {
        java {
            setSrcDirs(["../cosmetics-fabric/src/test/java"])
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "java_dependency", project.java_dependency
    inputs.property "loader_version", project.loader_version
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "java_dependency": project.java_dependency,
            "loader_version": project.loader_version
        )
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_bytecode_version.toInteger()
}

test {
    useJUnitPlatform()
}
