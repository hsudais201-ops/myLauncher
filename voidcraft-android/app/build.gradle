plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voidcraft.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.voidcraft.launcher'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-clean-room'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
